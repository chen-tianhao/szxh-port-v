<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

const SITE_URL = 'assets/vectors/site.json';

/* ---------- 渲染骨架 ---------- */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

const labelRenderer = new CSS2DRenderer({ element: document.getElementById('labels') });
labelRenderer.setSize(innerWidth, innerHeight);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05080c);

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 2, 40000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.maxDistance = 14000;
controls.minDistance = 30;

const sun = new THREE.DirectionalLight(0xfff0d8, 3.0);
sun.position.set(-1200, 1500, 900);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -2000, right: 2000, top: 1600, bottom: -1600, near: 100, far: 7000 });
scene.add(sun);
scene.add(new THREE.HemisphereLight(0x9dc3e0, 0x0c1116, 1.8));
scene.add(new THREE.AmbientLight(0x5f7791, 0.5));

const G = {
  imagery: new THREE.Group(), shore: new THREE.Group(), yard: new THREE.Group(),
  road: new THREE.Group(), crane: new THREE.Group(), ship: new THREE.Group(),
  labels: new THREE.Group(),
};
Object.values(G).forEach(g => scene.add(g));

/* ---------- 地理投影（ENU 局部平面，米） ---------- */
let REF, M_LAT = 110540, M_LON = 111320;
function setRef(lat, lon) { REF = { lat, lon }; M_LON = 111320 * Math.cos(lat * Math.PI / 180); }
function toXZ(lat, lon) { return { x: (lon - REF.lon) * M_LON, z: -(lat - REF.lat) * M_LAT }; }
function polyXZ(coords) { return coords.map(c => toXZ(c[0], c[1])); }

/* ---------- 通用几何 ---------- */
function ribbon(pts, width, y, color, opacity = 1) {
  const n = pts.length, positions = [], indices = [];
  for (let i = 0; i < n; i++) {
    const prev = pts[Math.max(0, i - 1)], next = pts[Math.min(n - 1, i + 1)];
    let dx = next.x - prev.x, dz = next.z - prev.z;
    const len = Math.hypot(dx, dz) || 1;
    dx /= len; dz /= len;
    const nx = -dz * width / 2, nz = dx * width / 2;
    positions.push(pts[i].x + nx, y, pts[i].z + nz);
    positions.push(pts[i].x - nx, y, pts[i].z - nz);
    if (i < n - 1) { const a = i * 2; indices.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  g.setIndex(indices);
  g.computeVertexNormals();
  return new THREE.Mesh(g, new THREE.MeshStandardMaterial({
    color, roughness: 0.85, metalness: 0.05,
    transparent: opacity < 1, opacity, side: THREE.DoubleSide,
  }));
}

function flatPoly(coords, y, color, opacity = 1) {
  const pts = polyXZ(coords);
  const shape = new THREE.Shape(pts.map(p => new THREE.Vector2(p.x, p.z)));
  const g = new THREE.ShapeGeometry(shape);
  g.rotateX(Math.PI / 2);
  const mesh = new THREE.Mesh(g, new THREE.MeshStandardMaterial({
    color, roughness: 0.9, transparent: opacity < 1, opacity,
    side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: -3,
  }));
  mesh.position.y = y;
  return mesh;
}

function extrudePoly(coords, height, color, opacity = 1) {
  const pts = polyXZ(coords);
  const shape = new THREE.Shape(pts.map(p => new THREE.Vector2(p.x, p.z)));
  const g = new THREE.ExtrudeGeometry(shape, { depth: height, bevelEnabled: false });
  g.rotateX(Math.PI / 2);
  const mesh = new THREE.Mesh(g, new THREE.MeshStandardMaterial({
    color, roughness: 0.8, metalness: 0.1, transparent: opacity < 1, opacity,
  }));
  mesh.position.y = height;
  mesh.castShadow = mesh.receiveShadow = true;
  return mesh;
}

function pointInPoly(px, pz, pts) {
  let inside = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const xi = pts[i].x, zi = pts[i].z, xj = pts[j].x, zj = pts[j].z;
    if (((zi > pz) !== (zj > pz)) && (px < (xj - xi) * (pz - zi) / (zj - zi) + xi)) inside = !inside;
  }
  return inside;
}

function shoelace(pts) {
  let a = 0;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) a += (pts[j].x + pts[i].x) * (pts[j].z - pts[i].z);
  return Math.abs(a / 2);
}

let W_POSITIVE_IS_WATER = null;
/** 长江在岸线哪一侧：用岸线中段法向与东北方向的夹角判定一次 */
function waterSign() {
  if (W_POSITIVE_IS_WATER !== null) return W_POSITIVE_IS_WATER;
  if (!SHORE || SHORE.length < 3) return true;
  const i = Math.floor(SHORE.length / 2);
  const a = SHORE[i - 1], b = SHORE[i];
  const dx = b.x - a.x, dz = b.z - a.z, L = Math.hypot(dx, dz) || 1;
  const nx = -dz / L, nz = dx / L;              // 左法向
  const NE = { x: Math.SQRT1_2, z: -Math.SQRT1_2 };  // 东北（x 向东，z 向南）
  W_POSITIVE_IS_WATER = (nx * NE.x + nz * NE.z) > 0;
  return W_POSITIVE_IS_WATER;
}
/** 点是否落在水域侧 */
function isWater(x, z) {
  if (!SHORE || SHORE.length < 3) return false;
  let bd = Infinity, bi = 1;
  for (let i = 0; i < SHORE.length; i++) {
    const d = (SHORE[i].x - x) ** 2 + (SHORE[i].z - z) ** 2;
    if (d < bd) { bd = d; bi = i; }
  }
  const i = Math.max(1, Math.min(bi, SHORE.length - 1));
  const a = SHORE[i - 1], b = SHORE[i];
  const cross = (b.x - a.x) * (z - a.z) - (b.z - a.z) * (x - a.x);
  return (cross > 0) === waterSign();
}

function addLabel(text, x, y, z, cls = 'lbl') {
  const el = document.createElement('div');
  el.className = cls;
  el.textContent = text;
  const o = new CSS2DObject(el);
  o.position.set(x, y, z);
  G.labels.add(o);
  return o;
}

/* ---------- 沿岸线链距 ---------- */
function chainage(pts) {
  const cum = [0];
  for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i].x - pts[i - 1].x, pts[i].z - pts[i - 1].z));
  return { cum, total: cum[cum.length - 1] };
}
function dirOf(pts, i) {
  const a = pts[Math.max(0, Math.min(i, pts.length - 2))], b = pts[Math.max(1, Math.min(i + 1, pts.length - 1))];
  const dx = b.x - a.x, dz = b.z - a.z, L = Math.hypot(dx, dz) || 1;
  return { x: dx / L, z: dz / L };
}
function pointAt(pts, cum, s) {
  const total = cum[cum.length - 1];
  if (s <= 0) return { x: pts[0].x, z: pts[0].z, tangent: dirOf(pts, 0) };
  if (s >= total) return { x: pts[pts.length - 1].x, z: pts[pts.length - 1].z, tangent: dirOf(pts, pts.length - 2) };
  for (let i = 1; i < pts.length; i++) {
    if (cum[i] >= s) {
      const t = (s - cum[i - 1]) / (cum[i] - cum[i - 1] || 1);
      const a = pts[i - 1], b = pts[i];
      return { x: a.x + (b.x - a.x) * t, z: a.z + (b.z - a.z) * t, tangent: dirOf(pts, i - 1) };
    }
  }
  return { x: pts[pts.length - 1].x, z: pts[pts.length - 1].z, tangent: dirOf(pts, pts.length - 2) };
}

/* ---------- 设备 ---------- */
function portalCrane() {
  const g = new THREE.Group();
  const steel = new THREE.MeshStandardMaterial({ color: 0x2b5f80, roughness: 0.55, metalness: 0.45 });
  const accent = new THREE.MeshStandardMaterial({ color: 0xd9a531, roughness: 0.5 });
  const legH = 34, base = 9, gauge = 8;
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.5, legH, 8), steel);
    leg.position.set(sx * base, legH / 2, sz * gauge);
    leg.castShadow = true; g.add(leg);
  }
  const house = new THREE.Mesh(new THREE.BoxGeometry(9, 6, 12), steel);
  house.position.set(0, legH + 3, 0); house.castShadow = true; g.add(house);
  const boom = new THREE.Mesh(new THREE.BoxGeometry(3, 2.4, 46), steel);
  boom.position.set(0, legH + 6, 17); boom.castShadow = true; g.add(boom);
  const grab = new THREE.Mesh(new THREE.BoxGeometry(4, 4, 4), accent);
  grab.position.set(0, legH - 6, 35); g.add(grab);
  g.userData.grab = grab;
  return g;
}

function shipMesh(len = 290, beam = 45, hullColor = 0x9c3a33) {
  const g = new THREE.Group();
  const s = new THREE.Shape();
  s.moveTo(-len / 2, -beam / 2);
  s.lineTo(len / 2 - 26, -beam / 2);
  s.quadraticCurveTo(len / 2, 0, len / 2 - 26, beam / 2);
  s.lineTo(-len / 2, beam / 2);
  s.lineTo(-len / 2, -beam / 2);
  const hull = new THREE.Mesh(new THREE.ExtrudeGeometry(s, { depth: 10, bevelEnabled: false }),
    new THREE.MeshStandardMaterial({ color: hullColor, roughness: 0.6, metalness: 0.3 }));
  hull.castShadow = hull.receiveShadow = true;
  g.add(hull);
  for (let i = 0; i < 5; i++) {
    const hatch = new THREE.Mesh(new THREE.BoxGeometry(len / 5 - 12, 2.4, beam - 9),
      new THREE.MeshStandardMaterial({ color: 0x3d4a58, roughness: 0.85 }));
    hatch.position.set(-len / 2 + (len / 5) * (i + 0.5), 11.5, 0);
    hatch.castShadow = true; g.add(hatch);
  }
  const house = new THREE.Mesh(new THREE.BoxGeometry(26, 18, beam - 8),
    new THREE.MeshStandardMaterial({ color: 0xe3e8ee, roughness: 0.7 }));
  house.position.set(-len / 2 + 18, 20, 0); house.castShadow = true; g.add(house);
  return g;
}

/* ---------- 构建 ---------- */
let SITE = null;
const ships = [];
const yardInfo = [];
let SHORE = null, FRONT = null, BERTH_INFO = null;
const BERTH_LABEL_Y = 42;

async function boot() {
  const res = await fetch(SITE_URL);
  SITE = await res.json();
  setRef(SITE.ref[0], SITE.ref[1]);
  buildImagery();
  buildShore();
  buildYards();
  buildRoads();
  buildBerths();
  buildShips();
  buildLegend();
  setView('1');
  window.__TWIN_READY__ = true;
}

function buildImagery() {
  // 影像之外的兜底底板（水域蓝灰），避免俯瞰时出现黑边
  const base = new THREE.Mesh(new THREE.PlaneGeometry(24000, 24000),
    new THREE.MeshBasicMaterial({ color: 0x14303d, toneMapped: false }));
  base.rotation.x = -Math.PI / 2;
  base.position.y = -1.5;
  G.imagery.add(base);

  const im = SITE.imagery;
  const nw = toXZ(im.lat_nw, im.lon_nw), se = toXZ(im.lat_se, im.lon_se);
  const w = Math.abs(se.x - nw.x), h = Math.abs(se.z - nw.z);
  const tex = new THREE.TextureLoader().load(im.file);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  const geo = new THREE.PlaneGeometry(w, h);
  geo.rotateX(-Math.PI / 2);
  const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map: tex, toneMapped: false }));
  mesh.position.set((nw.x + se.x) / 2, 0, (nw.z + se.z) / 2);
  G.imagery.add(mesh);
}

function buildShore() {
  let best = null;
  for (const w of SITE.shoreline || []) {
    const pts = polyXZ(w.coords);
    if (pts.length < 2) continue;
    G.shore.add(ribbon(pts, 11, 1.3, 0xff4a38, 1));           // 岸线压顶（醒目）
    G.shore.add(extrudeWall(pts, 9, 0x3a434f));                 // 岸壁立面
    if (!best || pts.length > best.length) best = pts;
  }
  SHORE = best;

  for (const p of SITE.piers || []) {
    const mesh = extrudePoly(p.coords, 7, 0x4c5560);
    mesh.userData = { type: 'pier', id: p.id };
    G.shore.add(mesh);
    const c = polyXZ(p.coords);
    const cx = c.reduce((s, v) => s + v.x, 0) / c.length, cz = c.reduce((s, v) => s + v.z, 0) / c.length;
    addLabel('突堤', cx, 22, cz, 'lbl');
  }
  for (const c of SITE.conveyors || []) {
    const pts = polyXZ(c.coords);
    G.shore.add(ribbon(pts, 7, 16, 0xd9a531, 1));
    for (let i = 1; i < pts.length; i++) {
      const a = pts[i - 1], b = pts[i];
      const L = Math.hypot(b.x - a.x, b.z - a.z);
      const n = Math.max(1, Math.round(L / 60));
      for (let k = 1; k < n; k++) {
        const t = k / n;
        const leg = new THREE.Mesh(new THREE.BoxGeometry(2.4, 16, 2.4),
          new THREE.MeshStandardMaterial({ color: 0x6b7480, roughness: 0.8 }));
        leg.position.set(a.x + (b.x - a.x) * t, 8, a.z + (b.z - a.z) * t);
        G.shore.add(leg);
      }
    }
    const mid = pts[Math.floor(pts.length / 2)];
    addLabel('皮带机栈桥', mid.x, 26, mid.z, 'lbl');
  }
  if (SITE.basin) {
    G.shore.add(flatPoly(SITE.basin.coords, 0.9, 0x1f5f7d, 0.95));
    const c = polyXZ(SITE.basin.coords);
    const cx = c.reduce((s, v) => s + v.x, 0) / c.length, cz = c.reduce((s, v) => s + v.z, 0) / c.length;
    addLabel('内港池（驳船作业区）', cx, 26, cz, 'lbl w');
  }
  for (const a of SITE.context_areas || []) {
    G.shore.add(flatPoly(a.coords, 0.7, 0x7a4bd0, 0.16));
    const nm = a.tags && (a.tags.name || a.tags['name:zh']);
    if (nm) {
      const c = polyXZ(a.coords);
      addLabel(nm, c[0].x, 22, c[0].z, 'lbl w');
    }
  }
}

function extrudeWall(pts, depth, color) {
  const positions = [], indices = [];
  for (let i = 0; i < pts.length; i++) {
    positions.push(pts[i].x, 1.3, pts[i].z, pts[i].x, 1.3 - depth, pts[i].z);
    if (i < pts.length - 1) {
      const a = i * 2;
      indices.push(a, a + 2, a + 1, a + 1, a + 2, a + 3);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  g.setIndex(indices);
  g.computeVertexNormals();
  return new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color, roughness: 0.9, side: THREE.DoubleSide }));
}

function buildYards() {
  for (const y of SITE.yards) {
    const pts = polyXZ(y.coords);
    const area = shoelace(pts);
    const mesh = flatPoly(y.coords, 1.0, new THREE.Color(y.color).getHex(), 0.5);
    mesh.userData = { type: 'yard', id: y.id, name: y.name, cargo: y.cargo, area };
    G.yard.add(mesh);

    const xs = pts.map(p => p.x), zs = pts.map(p => p.z);
    const x0 = Math.min(...xs), x1 = Math.max(...xs), z0 = Math.min(...zs), z1 = Math.max(...zs);
    const step = 42;
    const items = [];
    for (let x = x0 + step / 2; x < x1; x += step)
      for (let z = z0 + step / 2; z < z1; z += step)
        if (pointInPoly(x, z, pts) && !isWater(x, z)) items.push([x, z]);

    const im = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1),
      new THREE.MeshStandardMaterial({ roughness: 0.92, metalness: 0.04 }), Math.max(1, items.length));
    im.castShadow = im.receiveShadow = true;
    const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), p = new THREE.Vector3(), sc = new THREE.Vector3();
    const base = new THREE.Color(y.color), col = new THREE.Color();
    items.forEach(([x, z], i) => {
      const h = 8 + Math.random() * 8;
      p.set(x, h / 2 + 1, z); sc.set(step - 12, h, step - 12);
      m4.compose(p, q, sc); im.setMatrixAt(i, m4);
      col.copy(base).multiplyScalar(0.8 + Math.random() * 0.55);
      im.setColorAt(i, col);
    });
    im.instanceMatrix.needsUpdate = true;
    if (im.instanceColor) im.instanceColor.needsUpdate = true;
    G.yard.add(im);

    const cx = xs.reduce((s, v) => s + v, 0) / xs.length, cz = zs.reduce((s, v) => s + v, 0) / zs.length;
    addLabel(`${y.id} ${y.cargo} · ${(area / 10000).toFixed(1)} 万㎡`, cx, 30, cz, 'lbl y');
    yardInfo.push({ id: y.id, cargo: y.cargo, color: y.color, area, cx, cz });
  }
}

function buildRoads() {
  for (const r of SITE.roads) {
    const pts = polyXZ(r.coords);
    if (pts.length < 2) continue;
    const hw = r.tags.highway;
    const width = hw === 'secondary' ? 26 : hw === 'tertiary' ? 18 : 14;
    G.road.add(ribbon(pts, width, 1.7, 0x232a32, 1));
    G.road.add(ribbon(pts, 1.8, 1.9, 0xd9d2b0, 0.8));
    if (r.tags.name) {
      const mid = pts[Math.floor(pts.length / 2)];
      addLabel(r.tags.name, mid.x, 20, mid.z, 'lbl');
    }
  }
}

function buildBerths() {
  if (!SHORE) return;
  const start = toXZ(SITE.berths.start[0], SITE.berths.start[1]);
  const end = toXZ(SITE.berths.end[0], SITE.berths.end[1]);
  const nearestS = (pt) => {
    let best = 0, bd = Infinity;
    for (let i = 0; i < SHORE.length; i++) {
      const d = (SHORE[i].x - pt.x) ** 2 + (SHORE[i].z - pt.z) ** 2;
      if (d < bd) { bd = d; best = i; }
    }
    return cum[best];
  };
  // 用 A→B 的投影带裁剪出码头前沿那一段岸线，避免沿整条岸线绕远
  const abx = end.x - start.x, abz = end.z - start.z;
  const abLen2 = abx * abx + abz * abz || 1;
  const seg = [];
  for (const p of SHORE) {
    const t = ((p.x - start.x) * abx + (p.z - start.z) * abz) / abLen2;
    if (t < -0.02 || t > 1.02) continue;
    const px = start.x + abx * t, pz = start.z + abz * t;
    if (Math.hypot(p.x - px, p.z - pz) > 260) continue;
    seg.push({ x: p.x, z: p.z, t });
  }
  seg.sort((u, v) => u.t - v.t);
  if (seg.length < 4) { console.warn('前沿岸线样本不足'); }
  FRONT = seg.length >= 4 ? seg : SHORE;
  window.__FRONT = FRONT;
  const ch = chainage(FRONT);
  const cum = ch.cum;
  const s0 = 0, s1 = ch.total;
  const n = SITE.berths.count, total = ch.total;
  BERTH_INFO = { s0, s1, total, n, lengthEach: total / n };
  window.__BERTH_INFO = BERTH_INFO;

  for (let i = 0; i < n; i++) {
    const sa = s0 + total * i / n, sb = s0 + total * (i + 1) / n;
    const pa = pointAt(FRONT, cum, sa), pb = pointAt(FRONT, cum, sb);
    const mid = { x: (pa.x + pb.x) / 2, z: (pa.z + pb.z) / 2 };
    G.shore.add(ribbon([pa, mid, pb], 3, 2.4, 0x31d0aa, 0.95));

    const hint = SITE.berths.hints[i] || { id: (i + 1) + '#', cargo: '待核实', equipment: '—' };

    const tan = pa.tangent;
    let normal = { x: -tan.z, z: tan.x };
    // 法向统一指向陆侧（门机、标牌放陆侧，船放水侧）
    if (isWater(mid.x + normal.x * 45, mid.z + normal.z * 45)) normal = { x: -normal.x, z: -normal.z };

    addLabel(`${hint.id}·${hint.cargo}`, mid.x + normal.x * (95 + (i % 2) * 55),
      BERTH_LABEL_Y + (i % 3) * 14, mid.z + normal.z * (95 + (i % 2) * 55), 'lbl r');

    const crane = portalCrane();
    crane.position.set(mid.x + normal.x * 26, 0, mid.z + normal.z * 26);
    crane.rotation.y = Math.atan2(tan.x, tan.z);
    crane.userData = { type: 'crane', berth: hint.id, equipment: hint.equipment };
    G.crane.add(crane);
    // 记下每泊位的陆侧法向，供船舶定位反向使用
    BERTH_INFO.normals = BERTH_INFO.normals || [];
    BERTH_INFO.normals.push({ s: (sa + sb) / 2, normal, tan });
  }

  // 驳船泊位（内档）
  const bb = SITE.barge_berths;
  if (bb) {
    const bstart = toXZ(SITE.basin.coords[0][0], SITE.basin.coords[0][1]);
    const bend = toXZ(SITE.basin.coords[1][0], SITE.basin.coords[1][1]);
    for (let i = 0; i <= bb.count; i++) {
      const t = i / bb.count;
      const x = bstart.x + (bend.x - bstart.x) * t, z = bstart.z + (bend.z - bstart.z) * t;
      const tick = new THREE.Mesh(new THREE.BoxGeometry(2, 6, 14),
        new THREE.MeshStandardMaterial({ color: 0x31d0aa, roughness: 0.6 }));
      tick.position.set(x, 3, z + 24);
      G.shore.add(tick);
    }
    addLabel(`内档驳船泊位 ${bb.count} 个 · 总长 ${bb.frontage_m} m`,
      (bstart.x + bend.x) / 2, 40, (bstart.z + bend.z) / 2 + 24, 'lbl r');
  }
}

function buildShips() {
  if (!SHORE || !BERTH_INFO) return;
  const { cum } = chainage(FRONT);
  const layout = [
    { i: 1, len: 292, beam: 45, color: 0xa8433a },
    { i: 4, len: 225, beam: 32, color: 0x2d6d94 },
    { i: 6, len: 290, beam: 45, color: 0x3f6b47 },
  ];
  for (const L of layout) {
    const s = BERTH_INFO.s0 + BERTH_INFO.total * (L.i + 0.5) / BERTH_INFO.n;
    const p = pointAt(FRONT, cum, s);
    const tan = p.tangent;
    const rec = (BERTH_INFO.normals || []).find(n => Math.abs(n.s - s) < BERTH_INFO.lengthEach / 2);
    const land = rec ? rec.normal : { x: -tan.z, z: tan.x };
    const water = { x: -land.x, z: -land.z };
    const sh = shipMesh(L.len, L.beam, L.color);
    sh.position.set(p.x + water.x * (L.beam / 2 + 16), -4, p.z + water.z * (L.beam / 2 + 16));
    sh.rotation.y = Math.atan2(tan.x, tan.z) + Math.PI / 2;
    sh.userData = { type: 'ship', name: `在泊海轮 ${L.len}×${L.beam} m` };
    G.ship.add(sh); ships.push(sh);
  }
}

function buildLegend() {
  const rows = [];
  rows.push(`<div class="row"><span class="k">泊位前沿（1#–9#）</span><span>${BERTH_INFO.total.toFixed(0)} m</span></div>`);
  rows.push(`<div class="row"><span class="k">单泊位平均长度</span><span>${BERTH_INFO.lengthEach.toFixed(0)} m</span></div>`);
  for (const y of yardInfo) {
    rows.push(`<div class="row"><span class="k"><span class="sw" style="background:${y.color}"></span>${y.id} ${y.cargo}</span><span>${(y.area / 10000).toFixed(1)} 万㎡</span></div>`);
  }
  const yardTotal = yardInfo.reduce((s, y) => s + y.area, 0);
  rows.push(`<div class="row"><span class="k">已数字化堆场合计</span><span>${(yardTotal / 10000).toFixed(1)} 万㎡</span></div>`);
  rows.push(`<div class="row"><span class="k">公开资料堆场面积</span><span>134 万㎡</span></div>`);
  rows.push(`<div class="row"><span class="k">道路段 / 突堤 / 栈桥</span><span>${SITE.roads.length} / ${(SITE.piers || []).length} / ${(SITE.conveyors || []).length}</span></div>`);
  rows.push(`<div class="row"><span class="k">泊位编号来源</span><span>太航通〔2024〕0043号</span></div>`);
  rows.push(`<div style="color:#4d5b6b;font-size:10px;margin-top:6px">岸线·突堤·栈桥·道路 © OpenStreetMap contributors (ODbL)｜底图 © ${SITE.imagery.attribution}</div>`);
  document.getElementById('legend-body').innerHTML = rows.join('');
}

/* ---------- 视角与比例尺 ---------- */
function setView(key) {
  // 取「泊位前沿中点」与「各堆场重心」的加权中心，让整片作业区居中
  let cx = 0, cz = 0;
  if (BERTH_INFO && FRONT) {
    const { cum } = chainage(FRONT);
    const m = pointAt(FRONT, cum, (BERTH_INFO.s0 + BERTH_INFO.s1) / 2);
    cx = m.x; cz = m.z;
    if (yardInfo.length) {
      const yx = yardInfo.reduce((s, y) => s + y.cx, 0) / yardInfo.length;
      const yz = yardInfo.reduce((s, y) => s + y.cz, 0) / yardInfo.length;
      cx = cx * 0.35 + yx * 0.65;
      cz = cz * 0.35 + yz * 0.65;
    }
  }
  const views = {
    '1': [[cx, 2350, cz + 1], [cx, 0, cz]],        // 正上方俯瞰（上为北）
    '2': [[cx - 1500, 950, cz + 1500], [cx, 0, cz]],
    '3': [[cx - 320, 80, cz + 340], [cx, 20, cz]],
    '4': [[cx, 5200, cz + 1], [cx, 0, cz]],        // 大范围俯瞰（看整幅影像与河势）
  };
  const v = views[key] || views['1'];
  camera.position.set(v[0][0], v[0][1], v[0][2]);
  controls.target.set(v[1][0], v[1][1], v[1][2]);
  controls.update();
  updateScale();
}

function updateScale() {
  const d = camera.position.distanceTo(controls.target);
  const worldH = 2 * d * Math.tan(camera.fov * Math.PI / 360);
  const pxPerM = innerHeight / worldH;
  const targets = [50, 100, 200, 500, 1000, 2000];
  let pick = targets[0];
  for (const t of targets) if (t * pxPerM < innerWidth * 0.2) pick = t;
  document.getElementById('scalebar').style.width = (pick * pxPerM).toFixed(0) + 'px';
  document.getElementById('scaletext').textContent = pick >= 1000 ? (pick / 1000) + ' km' : pick + ' m';
}

/* ---------- 拾取 ---------- */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let infoBox = null;
renderer.domElement.addEventListener('pointerdown', (e) => {
  pointer.x = (e.clientX / innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects([...G.shore.children, ...G.yard.children, ...G.ship.children, ...G.crane.children], true);
  if (!hits.length) return;
  let o = hits[0].object;
  while (o && !(o.userData && o.userData.type)) o = o.parent;
  if (!o) return;
  const u = o.userData, txt = [];
  if (u.type === 'yard') txt.push(['堆场', u.id], ['名称', u.name], ['货种', u.cargo], ['面积', (u.area / 10000).toFixed(2) + ' 万㎡']);
  else if (u.type === 'crane') txt.push(['设备', u.equipment], ['所属泊位', u.berth]);
  else if (u.type === 'ship') txt.push(['对象', u.name]);
  else if (u.type === 'pier') txt.push(['设施', '突堤 / 靠泊平台'], ['OSM way', u.id]);
  if (!txt.length) return;
  if (!infoBox) {
    infoBox = document.createElement('div');
    infoBox.className = 'panel';
    infoBox.style.cssText = 'right:12px;bottom:12px;min-width:210px';
    document.body.appendChild(infoBox);
  }
  infoBox.innerHTML = '<h5 style="margin:0 0 6px;color:#31d0aa;font-size:11px">属性</h5>' +
    txt.map(([k, v]) => `<div class="row" style="display:flex;justify-content:space-between;gap:12px"><span style="color:#7d8b9c">${k}</span><span>${v}</span></div>`).join('');
});

document.querySelectorAll('#layers input').forEach(cb => {
  cb.addEventListener('change', () => {
    const g = G[cb.dataset.layer];
    if (g) g.visible = cb.checked;
  });
});
addEventListener('keydown', e => { if ('1234'.includes(e.key)) setView(e.key); });

/* ---------- 主循环 ---------- */
const clock = new THREE.Clock();
function animate() {
  const t = clock.elapsedTime;
  ships.forEach((s, i) => {
    s.position.y = -4 + Math.sin(t * 0.8 + i) * 0.3;
    s.rotation.z = Math.sin(t * 0.5 + i) * 0.003;
  });
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
  requestAnimationFrame(animate);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
  updateScale();
});

boot().then(() => animate());

window.__twin = { scene, camera, controls, renderer, groups: G, setView, get site() { return SITE; } };
</script>
